<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Polígonos y Centroide</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Calculadora de Polígonos y Centroide</h1>
        <p>Sistema MKS · Coordenadas en metros</p>
      </header>

      <main class="layout">
        <section class="panel controls">
          <h2>Ingresar coordenadas</h2>

          <div class="input-group">
            <label for="xValue">X [m]</label>
            <input id="xValue" type="number" step="0.01" placeholder="0.00" />
          </div>

          <div class="input-group">
            <label for="yValue">Y [m]</label>
            <input id="yValue" type="number" step="0.01" placeholder="0.00" />
          </div>

          <div class="buttons">
            <button id="addPointBtn">Agregar punto</button>
            <button id="loadExampleBtn" class="secondary">Ejemplo</button>
            <button id="clearBtn" class="danger">Limpiar</button>
          </div>

          <div class="divider"></div>

          <h3>Puntos ingresados</h3>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>X</th>
                <th>Y</th>
              </tr>
            </thead>
            <tbody id="pointsTableBody"></tbody>
          </table>
        </section>

        <section class="panel results">
          <h2>Resultado</h2>

          <div class="result-card">
            <div class="result-item">
              <span>Área</span>
              <strong id="areaResult">0.0000 m²</strong>
            </div>
            <div class="result-item">
              <span>Perímetro</span>
              <strong id="perimeterResult">0.0000 m</strong>
            </div>
            <div class="result-item">
              <span>Centroide X</span>
              <strong id="centroidXResult">0.0000 m</strong>
            </div>
            <div class="result-item">
              <span>Centroide Y</span>
              <strong id="centroidYResult">0.0000 m</strong>
            </div>
            <div class="result-item highlight">
              <span>Centroide</span>
              <strong id="centroidPointResult">(0.0000, 0.0000) m</strong>
            </div>
          </div>

          <div class="divider"></div>

          <canvas id="polygonCanvas" width="620" height="420"></canvas>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
